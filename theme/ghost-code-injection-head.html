<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Theme CSS</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://www.thegenesisaddress.ai/content/images/2025/09/janus-5.jpg">
    <link rel="icon" sizes="144x144" href="https://www.thegenesisaddress.ai/content/images/2025/09/janus-5.jpg">
    <link rel="icon" sizes="192x192" href="https://www.thegenesisaddress.ai/content/images/2025/09/janus-5.jpg">
    <link rel="icon" sizes="512x512" href="https://www.thegenesisaddress.ai/content/images/2025/09/janus-5.jpg">
    <style>
        :root {
            --genesisblue: #0ABDC6;
            --genesisgray: #1c1c1c;
            --color-background: #1c1c1c!important;
            --color-text: var(--genesisblue) !important;
            --color-primary-text: var(--genesisblue) !important;
            --color-secondary-text: var(--genesisblue) !important;
            --color-white: #1c1c1c !important;
            --color-light-gray: #000000 !important;
            --color-mid-gray: #000000 !important;
            --color-dark-gray: var(--genesisblue) !important;
            --color-black: var(--genesisblue) !important;
            --color-border: var(--genesisblue) !important;
        }

        /* Base Elements */
        body, 
        .site, 
        .post-full, 
        .post-card {
            background-color: var(--color-background) !important;
            color: var(--color-text) !important;
        }

        /* Links */
        a {
            color: var(--color-primary-text) !important;
        }

        /* Headers */
        h1, h2, h3, h4, h5, h6,
        .post-title,
        .gh-article-title,
        .gh-content h1,
        .gh-content h2,
        .gh-content h3,
        .gh-content h4,
        .gh-content h5,
        .gh-content h6,
        .entry-title,
        .post-full-title {
            color: var(--genesisblue) !important;
            text-shadow: none !important;
        }

        /* Content Text */
        .post-excerpt,
        .gh-post-meta,
        .gh-content p,
        .gh-content blockquote {
            color: var(--genesisblue) !important;
        }

        /* Header/Navigation */
        .gh-head {
            background: var(--color-background) !important;
        }

        .gh-head a,
        .site-nav a,
        .site-nav-item a,
        .nav a {
            color: var(--genesisblue) !important;
            text-shadow: none !important;
        }

        .gh-head a:hover,
        .site-nav a:hover,
        .site-nav-item a:hover,
        .nav a:hover {
            color: var(--genesisblue) !important;
        }

        /* Subscribe Button */
        .subscribe-button,
        .gh-subscribe-button {
            background-color: var(--color-background) !important;
            color: var(--genesisblue) !important;
            border-color: var(--color-border) !important;
        }

        .subscribe-button:hover {
            background-color: var(--genesisgray) !important;
            color: var(--genesisblue) !important;
        }

        /* Hamburger Menu Icon */
        .gh-head .gh-burger,
        .menu-toggle,
        .nav-toggle,
        .mobile-menu-toggle,
        .hamburger,
        .gh-nav-toggle,
        .gh-head-menu-toggle {
            color: var(--genesisblue) !important;
            background-color: transparent !important;
        }

        /* Hamburger Menu Lines */
        .gh-head .gh-burger-box,
        .gh-head .gh-burger-inner,
        .gh-head .gh-burger-inner::before,
        .gh-head .gh-burger-inner::after,
        .gh-head .gh-burger span,
        .gh-head .gh-burger div,
        .menu-toggle span,
        .nav-toggle span,
        .mobile-menu-toggle span,
        .hamburger span,
        .gh-nav-toggle span {
            background-color: var(--genesisblue) !important;
            border-color: var(--genesisblue) !important;
        }

        /* Hamburger Menu Active State */
        .gh-head .gh-burger.is-active .gh-burger-inner,
        .gh-head .gh-burger.is-active .gh-burger-inner::before,
        .gh-head .gh-burger.is-active .gh-burger-inner::after {
            background-color: var(--genesisblue) !important;
        }

        /* SVG Icons */
        .gh-head svg,
        .menu-toggle svg,
        .nav-toggle svg {
            fill: var(--genesisblue) !important;
            stroke: var(--genesisblue) !important;
        }

        /* Mobile Menu Background - FIXED */
        @media (max-width: 991px) {
            .gh-head-menu,
            .gh-head-menu-wrapper,
            .gh-head-open .gh-head-menu,
            .mobile-menu,
            .nav-menu {
                background-color: var(--genesisgray) !important; /* Dark gray background */
            }
            
            /* Menu items should remain cyan text on dark background */
            .gh-head-menu a,
            .gh-head-menu .nav a {
                color: var(--genesisblue) !important;
                background-color: transparent !important; /* No background on individual items */
            }

            /* Ensure hamburger is visible and properly styled */
            .gh-head .gh-burger {
                display: block !important;
                color: var(--genesisblue) !important;
            }

            .gh-head .gh-burger-inner::before,
            .gh-head .gh-burger-inner,
            .gh-head .gh-burger-inner::after {
                background-color: var(--genesisblue) !important;
            }
        }

        /* Additional Mobile Styling */
        @media (max-width: 480px) {
            /* Hamburger button and icon */
            .gh-head .gh-burger,
            .gh-head .menu-toggle,
            .gh-head .nav-toggle,
            .gh-head .mobile-toggle,
            .gh-head-actions button,
            .gh-head-actions .gh-burger,
            [class*="burger"],
            [class*="toggle"],
            [class*="menu-btn"] {
                color: var(--genesisblue) !important;
                background-color: transparent !important; /* Keep button background transparent */
            }
            
            /* Hamburger lines/spans */
            .gh-head .gh-burger span,
            .gh-head .gh-burger div,
            .gh-head .gh-burger::before,
            .gh-head .gh-burger::after,
            .gh-head-actions button span,
            .gh-head-actions button div {
                background-color: var(--genesisblue) !important;
                border-color: var(--genesisblue) !important;
            }
            
            /* SVG icons */
            .gh-head svg,
            .gh-head-actions svg,
            .gh-head [class*="icon"],
            .gh-head-actions [class*="icon"] {
                fill: var(--genesisblue) !important;
                color: var(--genesisblue) !important;
                stroke: var(--genesisblue) !important;
            }

            /* Menu text should remain cyan, but NO cyan backgrounds */
            .gh-head-actions a,
            .gh-head-menu a {
                color: var(--genesisblue) !important;
                background-color: transparent !important; /* This prevents cyan backgrounds */
            }
        }
    </style>

</html>
